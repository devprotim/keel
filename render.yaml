services:
  - type: web
    runtime: node
    name: keel
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @keel/shared build && pnpm --filter @keel/web build
    startCommand: NODE_ENV=production pnpm --filter @keel/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      # Render's load balancer sets X-Forwarded-For. Without this every client
      # shares the proxy's address, and one user's rate limit is everyone's.
      - key: TRUST_PROXY
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Billing (docs/pricing/stripe-setup.md). All unset: billing is off and
      # nothing is limited.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      # Durable storage. Unset, rooms live in memory and a redeploy loses them.
      # Which Render Postgres plan to use (and its backup/retention policy) is
      # still an open decision, so the database is not declared here yet. Once
      # it is, declare it under `databases:` and wire it with:
      #   - key: DATABASE_URL
      #     fromDatabase:
      #       name: keel-db
      #       property: connectionString
