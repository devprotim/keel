@if (visible()) {
  <section class="keel-island onboarding" aria-label="Get started">
    <header class="head">
      <button type="button" class="toggle" [attr.aria-expanded]="expanded()" (click)="expanded.set(!expanded())">
        <span class="title">Get started</span>
        <span class="progress">{{ doneCount() }} of {{ steps().length }}</span>
      </button>
      <button type="button" class="keel-btn keel-btn--ghost keel-btn--icon" aria-label="Hide the checklist" (click)="dismiss()">✕</button>
    </header>

    @if (expanded()) {
      <ol class="steps">
        @for (step of steps(); track step.id) {
          <li class="step" [class.done]="step.done" [class.next]="step === next()">
            <span class="check" aria-hidden="true">{{ step.done ? '✓' : '' }}</span>
            <div>
              <span class="step-title">{{ step.title }}<span class="keel-visually-hidden">{{ step.done ? ', done' : '' }}</span></span>
              @if (step === next()) {
                <p class="hint">{{ step.hint }}</p>
                @if (step.id === 'live') {
                  <pre class="command"><code>{{ pushCommand() }}</code></pre>
                  <button type="button" class="keel-btn keel-btn--ghost copy" (click)="copyCommand()">
                    {{ copied() ? 'Copied' : 'Copy command' }}
                  </button>
                }
              }
            </div>
          </li>
        }
      </ol>
    }
  </section>
}
