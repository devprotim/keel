<button
  #trigger
  type="button"
  class="keel-btn keel-btn--ghost"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [disabled]="empty()"
  [title]="triggerTitle()"
  (click)="toggle()"
>
  <ng-container i18n="Export button label">Export</ng-container>
</button>

@if (open()) {
  <div
    #menu
    class="keel-island menu"
    role="menu"
    aria-label="Export"
    i18n-aria-label="Export menu name"
    tabindex="-1"
    animate.enter="keel-pop-in"
    animate.leave="keel-pop-out"
    (keydown)="onMenuKeydown($event)"
  >
    <button type="button" class="item" role="menuitem" [disabled]="busy() !== null" (click)="export('png')">
      <span class="item-label" i18n="Export format; PNG is a file format">PNG image</span>
      <span class="item-hint">
        @if (busy() === 'png') {
          <ng-container i18n="Export in progress">Rendering…</ng-container>
        } @else {
          <ng-container i18n="Hint for the PNG export">For docs and slides</ng-container>
        }
      </span>
    </button>
    <button type="button" class="item" role="menuitem" [disabled]="busy() !== null" (click)="export('svg')">
      <span class="item-label" i18n="Export format; SVG is a file format">SVG image</span>
      <span class="item-hint">
        @if (busy() === 'svg') {
          <ng-container i18n="Export in progress">Rendering…</ng-container>
        } @else {
          <ng-container i18n="Hint for the SVG export">Scales without blurring</ng-container>
        }
      </span>
    </button>
    <button type="button" class="item" role="menuitem" [disabled]="busy() !== null" (click)="export('json')">
      <span class="item-label">JSON</span>
      <span class="item-hint" i18n="Hint for the JSON export; the code is an API path">Accepted as-is by <code>/api/validate</code></span>
    </button>

    <div class="separator" role="separator"></div>

    <button
      type="button"
      class="item check"
      role="menuitemcheckbox"
      [attr.aria-checked]="includeFindings()"
      (click)="includeFindings.set(!includeFindings())"
    >
      <span class="box" [class.on]="includeFindings()" aria-hidden="true">{{ includeFindings() ? '✓' : '' }}</span>
      <span class="item-label" i18n="Export menu checkbox">Show findings on images</span>
    </button>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
  </div>
}
